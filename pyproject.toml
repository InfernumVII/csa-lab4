[project]
name = "aka-lab4"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["pytest-golden"]

[tool.pytest.ini_options]
testpaths = ["tests"]
enable_assertion_pass_hook = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "PLC", "PLE", "PLW", "RUF"]
ignore = ["ANN401", "PLR0913", "PLR0912", "PLR0915", "PLR2004", "SIM108", "E501"]

[tool.mypy]
python_version = "3.11"
strict = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true
warn_unused_configs = true
