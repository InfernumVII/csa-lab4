in_source: "var max = 0;\nvar i = 999;\nwhile (i >= 100) {\n    var j = 999;\n   \
  \ while (j >= i) {\n        var p = i * j;\n        if (p <= max) {\n          \
  \  j = 0;\n        } else {\n            var t = p;\n            var rev = 0;\n\
  \            while (t != 0) {\n                rev = rev * 10 + t % 10;\n      \
  \          t = t / 10;\n            }\n            if (rev == p) {\n           \
  \     max = p;\n            }\n        }\n        j = j - 1;\n    }\n    i = i -
  1;\n}\nprintnum(max);\nputc('\\n');"
