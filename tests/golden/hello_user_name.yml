in_source: |
  var name[50];
  var idx = 0;
  var done = 0;

  irq handler {
      var ch = getc();
      
      if (ch == 0) {
          done = 1;      
      } else {
          name[idx] = ch;
          idx = idx + 1;
      }
  }

  print("What is your name?\n");

  while (done == 0) {
  }

  print("Hello, ");

  var i = 0;
  while (name[i] != 0) {
      putc(name[i]);
      i = i + 1;
  }

  print("!\n");
