in_source: "print(\"What is your name?\\n\");\nvar buf[64];\nvar i = 0;\nvar c = getc();\n\
  while (c != 10) {\n    buf[i] = c;\n    i = i + 1;\n    c = getc();\n}\nprint(\"\
  Hello, \");\nvar j = 0;\nwhile (j < i) {\n    putc(buf[j]);\n    j = j + 1;\n}\n\
  putc('!');\nputc('\\n');"
