in_source: "var a[4];\nvar b[4];\na[0] = 10; a[1] = 20; a[2] = 30; a[3] = 40;\nb[0]
  = 1; b[1] = 2; b[2] = 3; b[3] = 4;\nvar dot = 0;\nvar i = 0;\nwhile (i < 4) {\n\
  \    dot = dot + a[i] * b[i];\n    i = i + 1;\n}\nprintnum(dot);\nputc('\\n');"
