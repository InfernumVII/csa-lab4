in_source: |-
  var n = 12;
  var buf[12] = {53, 32, 51, 32, 49, 32, 52, 32, 50, 32, 48, 10};

  var i = 0;
  while (i < n - 1) {
      var j = 0;
      while (j < n - 1 - i) {
          if (buf[j] > buf[j + 1]) {
              var tmp = buf[j];
              buf[j] = buf[j + 1];
              buf[j + 1] = tmp;
          }
          j = j + 1;
      }
      i = i + 1;
  }

  i = 0;
  while (i < n) {
      printnum(buf[i]);
      putc(' ');
      i = i + 1;
  }
  putc('\n');
